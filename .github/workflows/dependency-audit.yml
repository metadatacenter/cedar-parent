name: Dependency advisory audit

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches:
      - develop
    paths:
      - pom.xml
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan managed Maven dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
