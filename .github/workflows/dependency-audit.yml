name: Dependency advisory audit

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches:
      - develop
    paths:
      - pom.xml
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan managed Maven dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
